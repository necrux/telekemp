apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: staticly
  namespace: telekemp
spec:
  hosts:
  - "*"
  gateways:
  - staticly-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: staticly
        port:
          number: 80
